    date: 2026-08-11
    object_id: information_sign_001
    method: vggt
    image_subset: 50 selected (even)
    image_dir: data/video/information_sign_001/images/jpg
    output_dir: outputs/experiments/exp_033_failed_vggt_information_sign_001
    parameters:
      device: cuda
      dtype: bfloat16
      image_mode: crop
      use_point_map: true
      conf_percentile: 25.0
    log:
      - "FAILED: capture had too little frame-to-frame overlap - median 26.8%"
      - "(min 1.1%, max 58.6%), 31/94 neighbor pairs below 20% (see"
      - "compute_image_overlap.py on data/video/information_sign_001/images/jpg)."
      - "Camera moved too fast between kept frames; a moving pedestrian also"
      - "passed through part of the capture, producing a ghosting streak in"
      - "this feed-forward (VGGT) reconstruction. Not usable as a result -"
      - "needs a re-shoot (slower pass, no bystanders in frame) before rerunning."
      - Registered images: 50/50
      - Points in dense point cloud: 13416200
      - Point cloud: outputs/experiments/exp_033_failed_vggt_information_sign_001/exp_033_failed_vggt_information_sign_001.ply

