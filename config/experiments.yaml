experiments:
  # Experiments for objects other than bench_001 (exp_001-022, exp_027-050 -
  # bollard_001, bollard_001_video, chair_001, chair_001_video2, bus_stop_001,
  # bollard_002, flashlight_001/002, information_sign_001, traffic_sign_001)
  # were removed along with their raw captures and outputs to save space.
  # Qualitative findings from them are preserved in docs/methodology_notes.md.

  exp_023:
    date: 2026-07-13
    object_id: bench_001
    method: vggt
    image_subset: 57 selected (even)
    image_dir: data/video/bench_001/images/jpg
    output_dir: outputs/experiments/exp_023_vggt_bench_001
    parameters:
      device: cuda
      dtype: bfloat16
      image_mode: crop
      use_point_map: true
      conf_percentile: 25.0
    log:
      - Registered images: 57/57
      - Points in dense point cloud: 11471214
      - Point cloud: outputs/experiments/exp_023_vggt_bench_001/exp_023_vggt_bench_001.ply

  exp_024:
    date: 2026-07-13
    object_id: bench_001
    method: mast3r_ga
    image_subset: 57 selected (even)
    image_dir: data/video/bench_001/images/jpg
    output_dir: outputs/experiments/exp_024_mast3r_ga_bench_001
    parameters:
      device: cuda
      image_size: 512
      scenegraph: complete
      shared_intrinsics: true
      matching_conf_thr: 0.0
      lr1: 0.07
      niter1: 300
      lr2: 0.01
      niter2: 300
      opt_depth: true
      min_conf_thr: 1.5
    log:
