    class: information_sign
    description: "Same information sign as information_sign_001, but using candidate video IMG_7067 instead of IMG_7063 for comparison. IMG_7067 scored worse in compute_image_overlap.py (median 19.4%, 51% of pairs <20%, 12 severe(<5%) pairs, longest bad-overlap run 6) than IMG_7063 (median 28.6%, 19% <20%, 0 severe, longest run 3) - kept as its own object_id (rather than overwriting information_sign_001's images/jpg) to compare results side by side without losing the IMG_7063 frame pool. 151 candidate frames extracted at 0.5s window over a 75.3s video."
    images_dir: data/video/information_sign_001_7067/images
    lidar_path: data/lidar/information_sign_001/information_sign_001_no_floor.ply

  flashlight_001:
    class: flashlight
    description: "Street flashlight/lamp post, video walk-around (data/video/flashlight_001/IMG_7051.MOV, 61s). Earlier experiments removed with raw captures/outputs to save space; redone here with a fresh video (97 candidate frames, 0.61s window) and the same LiDAR crop as before."
    images_dir: data/video/flashlight_001/images
    lidar_path: data/lidar/flashlight_001/flashlight_001_no_floor.ply

  information_sign_001:
    class: information_sign
    description: "Information sign, video walk-around. IMG_7053 (exp_033/034) failed: median 26.8% neighbor overlap, 33% of pairs below 20%, plus a pedestrian ghosting streak. Re-shot 5 candidate videos (IMG_7063-7067); compute_image_overlap.py picked IMG_7063 as best (no severe/near-zero overlap pairs, no long bad-overlap runs, unlike 7065-7067 which showed pedestrian/fast-pan-like drops). Re-extracted at 0.5s window (161 candidate frames, vs 1.0s's 81) since overlap at 1.0s spacing was still worse than the failed capture (41% of pairs <20% after even-selecting 50) - denser 0.5s sampling brings it down to 3.75% (median 36.6%). Use num_images ~100 (12% pairs <20%) rather than the config default of 50 for this object."
    images_dir: data/video/information_sign_001/images
    lidar_path: data/lidar/information_sign_001/information_sign_001_no_floor.ply

  traffic_sign_001:
    class: traffic_sign
    description: "Traffic sign, video walk-around (data/video/traffic_sign_001/IMG_7052.MOV, 42s). Earlier experiments removed with raw captures/outputs to save space; redone here with a fresh video (98 candidate frames, 0.42s window) and the same LiDAR crop as before."
    images_dir: data/video/traffic_sign_001/images
    lidar_path: data/lidar/traffic_sign_001/traffic_sign_001_no_floor.ply

  wayfinding_sign_001:
    class: wayfinding_sign
    description: "Directional/wayfinding street sign, captured via video walk-around (data/video/wayfinding_sign_001/video/IMG_5939.MOV)"
    images_dir: data/video/wayfinding_sign_001/images
    # lidar_path: data/lidar/wayfinding_sign_001/wayfinding_sign_001.las
    notes: >
      Video-only capture. Mostly planar/flat geometry (sign face) plus a
      post - worth checking whether reconstruction quality differs from the
      bollard's curved-surface case. Run
      src/data_preparation/extract_video_frames.py on the video to populate
      images/jpg before reconstruction. Not yet run: no experiments exist for
      this object.

  flashlight_004:
    class: flashlight
    description: "Fourth flashlight capture: 105 individually-shot JPEG photos (already JPEG, no HEIC conversion needed), EXIF timestamps present so capture-order sorting works. Running COLMAP + hloc+COLMAP + MASt3R-GA (logwin-7) + VGGT."
    images_dir: data/images/flashlight_004/images
    # lidar_path: not yet cropped - no crop exists for this object yet; reconstructions
    # can run without it, but accuracy/completeness/F1 against LiDAR cannot be computed
    # until src/data_preparation/crop_objects_from_lidar.py is run locally (per
    # workflow_pod_split memory, LiDAR stays local/off the pod).
    notes: >
      Same busstop-family capture pattern as flashlight_001/flashlight_003
      (individually-shot photos, not a video walk-around) - using
      config/reconstruction_busstop.yaml / config/hloc_colmap_busstop.yaml for
      COLMAP / hloc+COLMAP (exhaustive matching + geom_consistency:false) and
      config/mast3r_ga_logwin.yaml (scenegraph: logwin-7, not the swin-8 default)
      for MASt3R-GA, all 105 images. flashlight_003's overlap check showed weak
      overlap (median 1.1%, most pairs <20%) - likely a similar tall/thin object,
      worth checking reconstruction quality the same way.

