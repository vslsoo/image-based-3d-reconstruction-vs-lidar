    description: "Second information sign capture, 32 individually-shot HEIC photos (converted to JPG), same pattern as bus_stop_001. compute_image_overlap.py exhaustive check (all 496 pairs) showed similarly weak overlap: median 0.7%, 494/496 pairs <20%. Running MASt3R-GA at default settings (config/mast3r_ga.yaml). No LiDAR reference crop yet."
    images_dir: data/images/information_sign_002/images
    # lidar_path: not yet cropped

  bus_stop_001:
    class: bus_stop
    description: "Bus stop, captured as 48 individually-shot HEIC photos (converted to JPG) rather than video, trying to keep the whole object visible in every frame. compute_image_overlap.py showed very weak overlap even exhaustively checking all 1128 pairs (not just capture-order-adjacent ones, since individually-shot photos aren't necessarily taken in walk-around order): median 0.3%, 1127/1128 pairs <20%, max only 25.1%. Likely cause: shooting from varying distances/angles to fit the whole object in frame reduces pixel-level surface overlap even though the object itself is visible in every shot. Running MASt3R-GA (more overlap-tolerant than COLMAP/hloc) at both default settings (config/mast3r_ga.yaml, swin-8) and exp_052's bench_002-tuned settings (swin-16, matching_conf_thr 1.0, min_conf_thr 2.0, niter1/niter2 500) to compare. No LiDAR reference crop yet."
    images_dir: data/video/bus_stop_001/images
    # lidar_path: not yet cropped

  flashlight_002:
    class: flashlight
    description: "Second flashlight capture (two candidate videos shot, IMG_7068 76s / IMG_7069 124s). compute_image_overlap.py favored IMG_7069 (median 29.5%, 15% of pairs <20%, 0 severe(<5%) pairs, longest bad run 4) over IMG_7068 (28.6%, 18%, 1, 5) - both were solid, IMG_7069 picked for the slightly better/longer capture. 249 candidate frames extracted at 0.5s window; using num_images=150 (best overlap within the user's 100-150 cap: median 22.8%, 38% of pairs <20%, vs 61% at num_images=100)."
    images_dir: data/video/flashlight_002/images
    lidar_path: data/lidar/flashlight_001/flashlight_001_no_floor.ply

  bench_002:
    class: bench
    description: "Second bench capture (video walk-around, data/video/bench_002/IMG_7073.MOV, 139.8s). 280 candidate frames extracted at 0.5s window - overlap is notably weaker than information_sign_001's final IMG_7063 capture (median 26.5%, 29% of neighbor pairs <20% even using the full 280-frame pool, vs 3.75% for IMG_7063). Ran VGGT/COLMAP/hloc+COLMAP/MASt3R-GA all at num_images=150 per the user's 100-150 cap - all 4 completed with usable results despite the weak overlap (COLMAP 149/150, hloc+COLMAP 121/150 partial, MASt3R-GA and VGGT both 150/150). No LiDAR reference crop yet."
    images_dir: data/video/bench_002/images
    # lidar_path: not yet cropped

  bench_001:
    class: bench
    description: "Street/park bench, captured via video walk-around (data/video/bench_001/video/IMG_6178.MOV) - first real (non-test) object for the diploma."
    images_dir: data/video/bench_001/images
    lidar_path: data/video/bench_001/lidar/bench_001_lidar.ply
    notes: >
      Video-only capture. 57 candidate frames extracted (1.0s sharpest-per-
      window, over a 56s video) into images/jpg; reconstruction scripts pick
      a 50-100 image diverse subset from this pool.

      LiDAR reference (bench_001/lidar/bench_001.ply): cropped from the
      Sensat-Euston-Track2 street scan, X/Y bbox [291581.51, 291585.45] x
      [287825.53, 287831.61], Z capped to [27.0, 29.0] to exclude an
      unrelated tall structure (building/tree, up to Z=38) sharing the same
      X/Y footprint. Coordinates stored LOCALLY, shifted by -[291581, 287825,
      27] relative to the source file - see the precision pitfall below,
      this shift is required, not cosmetic.

      Three things went wrong on the way here, in case they recur for a
      future object (see also docs/methodology_notes.md's "LiDAR processing
      pitfalls" section, consolidated from later objects):
      1. An interactively-cropped bench.laz (made in CloudCompare from the
         big street crop) silently lost ~27% of its points versus cropping
         the same bbox directly from the original file - almost certainly
         CloudCompare's viewport LOD thinning points during the interactive
         polygon-crop. Always re-crop the final bbox directly from the
         original file with pdal rather than trusting an interactively-
         exported subset.
      2. BIG ONE - PLY silently truncates large absolute coordinates to
         whole meters. Sensat-Euston-Track2's X/Y are ~291000/287000-scale
         UTM-like values. Both pdal's writers.ply AND Open3D's
         write_point_cloud store x/y/z as 32-bit float; at that magnitude
         float32's ULP is only ~0.03m in principle, but in practice the
         round-trip collapsed EVERY point onto an exact 1.0m grid (confirmed
         by dumping the .ply back out and measuring nearest-neighbor XY
         distance = exactly 1.000 with zero variance) - initially misread
         as "the source file is only sampled on a 1m grid here", which was
         wrong and sent the whole floor-removal analysis down a false path.
         Re-dumping the same points to CSV via `pdal translate ... .txt`
         (arbitrary-precision text, no schema truncation) and cross-checking
         showed the true underlying data is dense (~0.02m spacing, matching
         what the source visually looks like in CloudCompare). Fix: always
         recenter LiDAR points to a small local origin (subtract something
         like the crop's own bbox min corner) BEFORE writing/reading any
         .ply for this project's Open3D-based scripts - never feed
         UTM-scale absolute coordinates through a .ply round-trip.
      3. remove_ground_plane.py's RANSAC largest-plane, run on the
         (wrongly) grid-collapsed data, picked a vertical scan-line artifact
         instead of the ground. Once the precision bug above was fixed and
         the real dense data was used, a direct height cutoff (Z <= 27.65,
         i.e. local Z <= 0.65 - the sharp low-elevation density peak in a Z
         histogram) worked fine and gave a recognizably bench-shaped result
         (elongated top-view footprint, seat-height plane + raised backrest
         in the side view).

      Bottom line: if a LiDAR crop for a future object looks like sparse
      disconnected vertical lines/dots in CloudCompare after any Open3D
      processing, suspect this PLY truncation bug FIRST (check whether the
      file was ever round-tripped through .ply with large absolute
      coordinates) before concluding the source data itself is sparse.

