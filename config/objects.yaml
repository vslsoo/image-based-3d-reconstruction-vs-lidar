    images_dir: data/images/bollard_003/images
    # lidar_path: not yet cropped

  bench_003:
    class: bench
    description: "Third bench capture, 54 individually-shot HEIC photos (converted to JPG), same pattern as bus_stop_001/information_sign_002. compute_image_overlap.py exhaustive check (all 1431 pairs) showed weak overlap: median 0.3%, 1424/1431 pairs <20%. Ran all 4 methods (MASt3R-GA default, VGGT, COLMAP, hloc+COLMAP - the latter two with exhaustive matching/pairing and geom_consistency disabled, per config/reconstruction_busstop.yaml and config/hloc_colmap_busstop.yaml). LiDAR reference cropped from the same Sensat-Euston-Track2 street scan as bench_001 (data/lidar/bench_003/bench_003.ply, CloudCompare crop, double-precision XYZ, UTM-scale absolute coords - not recentered, but confirmed this Open3D version round-trips .ply as double so no precision loss). Floor removed via remove_ground_plane.py --z-cutoff 28.02 --keep-side above --keep-largest-cluster --cluster-eps-fraction 0.0126 (clear valley in the Z histogram between a wide flat floor band at Z~27.9-28.0 and a raised block at Z 28.02-28.4; DBSCAN then dropped a small separate low debris cluster) -> bench_003_no_floor.ply, 2954 points. The kept object is a thin, partial-surface slab (~1.6x1.7x0.4m bbox) rather than a full solid bench volume - consistent with a mobile/street LiDAR only catching one grazing-angle face of the bench, not a bad crop."
    images_dir: data/images/bench_003/images
    lidar_path: data/lidar/bench_003/bench_003_no_floor.ply
    # lidar_path: not yet cropped

  information_sign_002:
