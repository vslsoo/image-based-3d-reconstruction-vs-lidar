    description: "Bollard, second capture (video walk-around, data/video/bollard_002/IMG_7049.mov, 32s). Earlier experiments (exp_031-050 batch) were removed with their raw captures/outputs to save space (see docs/methodology_notes.md); redone here with a fresh video (97 candidate frames, 0.32s window) and the same LiDAR crop as before."
    images_dir: data/video/bollard_002/images
    lidar_path: data/lidar/bollard_002/bollard_002_no_floor.ply

